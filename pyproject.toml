[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bengal-chirp"
version = "0.10.2"
description = "Python web framework for HTMX, HTML fragments, streaming HTML, and Server-Sent Events"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Bengal Contributors", email = "lbeezr@icloud.com" }]
keywords = [
    "python-web-framework",
    "web-framework",
    "asgi",
    "html-over-the-wire",
    "htmx",
    "server-rendered",
    "html-fragments",
    "sse",
    "streaming",
    "free-threading",
    "templates",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
dependencies = [
    "kida-templates>=0.11.0", # Component/template checkpoint; no 0.10 API migration
    "anyio>=4.0",            # Async runtime (backend-agnostic, structured concurrency)
    "bengal-pounce>=0.8.2",  # HEAD body suppression across H1/H2/H3 (#554)
    "milo-cli>=0.4.1,<0.5",  # Typed CLI registration and deny-by-default agent surfaces (#572)
]

[project.optional-dependencies]
# Form/multipart parsing (security-critical, battle-tested)
forms = ["python-multipart>=0.0.18"]

# Signed cookie sessions
sessions = ["itsdangerous>=2.2.0"]

# Authentication (password hashing with argon2)
auth = ["argon2-cffi>=23.1.0"]

# Passkeys / WebAuthn (py_webauthn — pins cryptography). 2.x ships stdlib
# @dataclass structs; 1.x was pydantic with a different construction/serialization
# API, hence the <3 cap. Deliberately NOT in `all`/`full`: it is the heaviest
# extra (transitive cryptography/Rust build) and is never a default path.
passkeys = ["webauthn>=2.8,<3"]

# Test client transport
testing = ["httpx>=0.27.0"]

# Typed async database access (PostgreSQL via in-tree pelt — no extra deps)
data-pg = []

# LLM streaming (provider-agnostic via raw HTTP)
ai = ["httpx>=0.27.0"]

# AWS Bedrock signing for the bedrock LLM provider
ai-bedrock = ["botocore>=1.34", "httpx>=0.27.0"]

# Markdown rendering (patitas + rosettes syntax highlighting — same ecosystem)
markdown = ["patitas[syntax]>=0.4.0"]

# chirp-ui component library (CSS, themes, layout macros)
ui = ["chirp-ui>=0.11.0"]

# Config from env (python-dotenv for local .env loading)
config = ["python-dotenv>=1.0.0"]

# Redis-backed sessions and rate limiting
redis = ["redis>=5.0.0"]

# All optional features
all = [
    "python-multipart>=0.0.18",
    "itsdangerous>=2.2.0",
    "argon2-cffi>=23.1.0",
    "httpx>=0.27.0",
    "patitas[syntax]>=0.4.0",
]

# Benchmark suite (Chirp vs FastHTML vs FastAPI vs Flask vs Starlette vs Litestar)
benchmark = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "flask>=3.0.0",
    "gunicorn>=23.0.0",
    "starlette>=0.40.0",
    "litestar>=2.13.0",
    "httpx>=0.27.0",
    "python-fasthtml>=0.14.3",
]

# Full stack: framework + data + AI
full = [
    "python-multipart>=0.0.18",
    "itsdangerous>=2.2.0",
    "argon2-cffi>=23.1.0",
    "httpx>=0.27.0",
    "patitas[syntax]>=0.4.0",
]

[project.scripts]
chirp = "chirp.cli:main"

[project.urls]
Homepage = "https://lbliii.github.io/chirp/"
Documentation = "https://lbliii.github.io/chirp/"
Repository = "https://github.com/lbliii/chirp"
Changelog = "https://github.com/lbliii/chirp/blob/main/CHANGELOG.md"

# No tool.uv.sources table: Chirp is developed as a standalone uv project.
# Local development, CI, and external installs resolve dependencies from PyPI.

[tool.uv]
python-preference = "only-managed"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chirp = ["py.typed", "templating/macros/**/*.html", "server/devtools/js/*.js"]

# =============================================================================
# Ruff — Linter & Formatter
# =============================================================================
# Matches bengal/kida/patitas/rosettes rule set
# Line length: 100 (consistent across all projects)
# Target: Python 3.14 (free-threading)

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, variables, etc.)
    "UP",   # pyupgrade — Python modernization
    "B",    # flake8-bugbear — common bugs and design problems
    "SIM",  # flake8-simplify — simplify code
    "I",    # isort — import sorting
    "N",    # pep8-naming — naming conventions
    "PIE",  # misc lints (unnecessary pass, duplicate dict keys, etc.)
    "PERF", # perflint — performance anti-patterns
    "C4",   # unnecessary comprehensions/list()/dict() calls
    "RUF",  # Ruff-specific (unused noqa, mutable class defaults, etc.)
    "PT",   # flake8-pytest-style — pytest best practices
    "T20",  # flake8-print — catch stray print() statements
    "A",    # flake8-builtins — detect builtin shadowing
    "S",    # bandit — security checks
    "TRY",  # tryceratops — exception handling best practices
    "LOG",  # flake8-logging — logging best practices
]
ignore = [
    "E501",   # line too long — handled by formatter
    "A002",   # builtin-argument-shadowing — `next` is the middleware convention
    "TRY003", # long exception messages — we prefer inline detail strings
    "TRY300", # try-return — idiomatic in check-then-proceed patterns
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]              # Allow unused imports in __init__ files (re-exports)
"tests/**/*.py" = ["S101", "S104", "S105", "S106", "S107", "S603", "TRY301"] # Tests use asserts, test secrets, subprocess, raise-in-try
"examples/**/*.py" = ["E402", "S101", "S105", "S106", "S107", "S307", "S311", "S608", "T20"] # Examples are demos
"benchmarks/**/*.py" = ["T20", "S101", "S603"] # Prints, asserts, subprocess in benchmarks
"scripts/**/*.py" = ["T20", "S603", "S607"] # Scripts print, and may shell out to gh/git
"src/chirp/cli/**/*.py" = ["T20"]     # CLI commands use print for user output
"src/chirp/app/diagnostics.py" = ["T20"] # Startup diagnostics use print
"src/chirp/app/server.py" = ["T20"]   # Server startup uses print
"src/chirp/testing/assertions.py" = ["S101"] # Test assertion helpers use assert by design
"src/chirp/testing/eval.py" = ["S101"] # Eval assertion helpers use assert by design
"src/chirp/testing/sse.py" = ["S101"] # Test assertion helpers use assert by design
"src/chirp/app/__init__.py" = ["S101"] # Internal state assertions after freeze
"src/chirp/app/runtime.py" = ["S101"] # Internal state assertions after freeze
"src/chirp/data/query.py" = ["S608"]  # Query builder constructs SQL safely (parameterized)
"src/chirp/data/migrate.py" = ["S608"] # Migration SQL is framework-generated
"src/chirp/data/shapes.py" = ["S608"]  # Shape SQL is author-declared; :name placeholders parameterized (never concatenated)
"src/chirp/security/access_grants.py" = ["S608"] # Grant SQL uses validated identifiers + bound params
"src/chirp/server/production.py" = ["S104"] # Server binds to 0.0.0.0 intentionally
"src/chirp/contracts/**/*.py" = ["S110", "S112", "S608"] # Contract checkers intentionally suppress errors

# =============================================================================
# ty — Type Checker (Rust-based, Astral)
# =============================================================================
# Strict by default. chirp targets zero type: ignore comments.

[tool.ty.environment]
python-version = "3.14"

[tool.ty.analysis]
# Optional deps; allow when not installed
allowed-unresolved-imports = [
    "chirp_ui",
    "chirp_ui.filters",
    "chirp_ui.components",
    "asyncpg",
    "patitas",
    "argon2",
    "argon2.exceptions",
    "webauthn",
    "webauthn.helpers",
    "webauthn.helpers.structs",
    "webauthn.helpers.exceptions",
    "dotenv",
    "redis.asyncio",
    "opentelemetry",
    "opentelemetry.trace",
    "botocore",
    "botocore.session",
    "botocore.auth",
    "botocore.awsrequest",
    "pydantic",
]

[tool.ty.src]
exclude = ["dist/", "build/", "tests/"]

[tool.ty.rules]
# Strict: all rules are errors by default.
# Only relax what produces genuine false positives.
unused-ignore-comment = "warn" # Flag stale type: ignore for cleanup

# Mapping.get override in Headers/QueryParams/FormData/LazyHeaders/LazyCookies
# is intentional (str-only keys/values); LSP violation is accepted.
invalid-method-override = "ignore"

# =============================================================================
# Pytest
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--import-mode=importlib",
    "-p",
    "no:dori_snapshots",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests requiring full app setup",
    "passkeys_e2e: browser e2e with virtual WebAuthn authenticator (opt-in)",
    "issue: associate a test with the GitHub issue(s) whose acceptance criteria it proves, e.g. @pytest.mark.issue(143) (see docs/backlog-automation.md)",
]

# =============================================================================
# Coverage
# =============================================================================

[tool.coverage.run]
source = ["src/chirp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "def __repr__",
]

# =============================================================================
# Development Dependencies (PEP 735 — install with: uv sync --group dev)
# =============================================================================

[dependency-groups]
docs = [
    "bengal>=0.5.0", # Legacy static site path (deprecated for Pages deploy)
    "lunr>=0.7.0",   # Pre-built search index
    "chirp-ui>=0.11.0", # Bengal chirp-theme package (bengal.themes entry point)
    "jsonschema>=4.0.0", # DCP catalog.json validation
]
dev = [
    # Testing
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.5.0",
    "hypothesis>=6.100.0",
    # Type Checking
    "ty>=0.0.11",
    # Linting & Formatting
    "ruff>=0.15.1", # Require ruff>=0.15.1 for correct handling of newer Python syntax
    # Changelog
    "towncrier>=24.8.0",
    # Task runner — `poe <task>` / the `poe preflight` pre-push hook + docs rely on it
    "poethepoet>=0.29.0",
    # Pre-commit (prek = Rust-based drop-in, reads .pre-commit-config.yaml)
    "prek>=0.3.2",
    # Test utilities (optional deps needed for full test suite)
    "httpx>=0.27.0",
    "python-multipart>=0.0.18",
    "itsdangerous>=2.2.0",
    "webauthn>=2.8,<3",         # Lucky Cat passkey tests are part of the example suite
    "patitas[syntax]>=0.4.0",   # Markdown + syntax highlighting for ollama example tests
    "chirp-ui>=0.11.0",         # Layout macros for llm_playground example tests
]
browser = [
    "playwright==1.61.0",       # Chrome for Testing 149 WebMCP/fallback lane; install with: uv sync --group dev --group browser
]

# =============================================================================
# Task Runner (poethepoet) — use: poe <task>
# =============================================================================

[tool.poe.tasks]
# Testing
test = { cmd = "pytest", help = "Run full test suite" }
test-fast = { cmd = "pytest tests/ -x -q --timeout=10", help = "Fast feedback loop" }
test-examples = { cmd = "pytest examples/ -x -q", help = "Run example tests" }
test-cov = { cmd = "pytest tests/ --cov=chirp --cov-report=term-missing", help = "Run tests with coverage" }
test-invariants = { cmd = "pytest tests/test_lazy_imports.py tests/test_public_api_docs.py -q", help = "Repo-wide public-API snapshot + docs-coverage invariants (no full suite)" }

# Type Checking
ty = { cmd = "ty check src/chirp/", help = "Run ty type checker" }
ty-strict = { cmd = "ty check src/chirp/ --error-on-warning", help = "Strict type checking" }

# Linting & Formatting
lint = { cmd = "ruff check .", help = "Run ruff linter" }
lint-fix = { cmd = "ruff check . --fix", help = "Run ruff linter with auto-fix" }
format = { cmd = "ruff format .", help = "Format code with ruff" }
format-check = { cmd = "ruff format . --check", help = "Check formatting" }

# Pre-commit
hooks = { cmd = "prek run --all-files", help = "Run all pre-commit hooks" }
hooks-install = { cmd = "prek install", help = "Install pre-commit hooks" }

# CI Pipeline
ci = { sequence = [
    "lint",
    "format-check",
    "ty",
    "test",
], help = "Full CI check" }
check = { sequence = [
    "lint",
    "format-check",
    "ty",
], help = "Quick check (no tests)" }
preflight = { sequence = [
    "lint",
    "format-check",
    "ty",
    "test-invariants",
], help = "Fast pre-push: cheap whole-repo invariants (no full suite)" }

# Build & Release
dist = { shell = "rm -rf dist/ && uv build --out-dir dist/ && ls -la dist/", help = "Build distribution" }

# Docs site (always uses project venv Bengal, not a global `bengal` install).
# env/python.env sets PYTHON_GIL=0; .python-version pins 3.14t (see config/python.env).
site-build = { cwd = "site", cmd = "uv run --group docs bengal build --environment local", envfile = "config/python.env", help = "Build docs site locally (Bengal from docs group)" }
site-build-prod = { cwd = "site", cmd = "uv run --group docs bengal build --environment production", envfile = "config/python.env", help = "Build docs site for production (/chirp baseurl)" }
site-serve = { cwd = "site", cmd = "uv run --group docs bengal serve --environment local", envfile = "config/python.env", help = "Serve docs site with hot reload (http://127.0.0.1:5173)" }
bengal = { cwd = "site", cmd = "uv run --group docs bengal", envfile = "config/python.env", help = "Run Bengal in site/ with free-threaded defaults (e.g. poe bengal s)" }

# Changelog (towncrier)
changelog = { cmd = "towncrier build --version 0.10.2 --yes", help = "Compile changelog.d fragments into CHANGELOG.md" }
changelog-draft = { cmd = "towncrier build --version 0.10.2 --draft", help = "Preview changelog from fragments (stdout)" }
changelog-check = { cmd = "towncrier check --compare-with origin/main", help = "Verify branch adds a fragment (vs main)" }

# Benchmarks
benchmark = { cmd = "python -m benchmarks.run all", help = "Run Chirp vs FastAPI vs Flask vs Starlette vs Litestar benchmarks" }
benchmark-core = { cmd = "python -m benchmarks.core", help = "Run Chirp core regression benchmarks and emit JSON" }
benchmark-pelt = { cmd = "python -m benchmarks.pelt", help = "Run Pelt live-PostgreSQL concurrency and boundary benchmarks" }
benchmark-mixed = { cmd = "python -m benchmarks.run_mixed", help = "Mixed workload (JSON + SSE) — verifies adaptive handoff" }

# Cleanup
clean.shell = """
rm -rf dist build .pytest_cache .coverage htmlcov .ruff_cache .ty_cache
find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
"""
clean.help = "Remove build artifacts and caches"

# =============================================================================
# Towncrier — Changelog Fragments
# =============================================================================
# Fragment convention: changelog.d/<+slug>.<type>.md
# Compile with: poe changelog (or towncrier build --yes)
# Preview with: poe changelog-draft

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
package = "chirp"
package_dir = "src"
title_format = "## [{version}] — {project_date}"
issue_format = "[#{issue}](https://github.com/lbliii/chirp/issues/{issue})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true
