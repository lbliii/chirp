[judgment.public]
advocate = ["Strict drift checks for exports, maturity tiers, config fields, and optional missing-extra behavior."]
do_not = ["Add convenience exports, speculative AppConfig fields, or mandatory dependencies for optional capabilities."]

[judgment.app]
advocate = ["Whole-state publication, complete contract snapshots, and deterministic mount/freeze diagnostics."]
do_not = ["Add runtime mutation escape hatches or let checks observe half-published state."]

[judgment.templating]
advocate = ["DOM-level assertions and diagnostics naming template, block, target, route, and registration source."]
do_not = ["Create a partials system, return empty swaps, or use inheritance to override sibling layout blocks."]

[judgment.contracts]
advocate = ["Checks that prevent visible corruption and tell developers exactly what to fix."]
do_not = ["Become a preference linter, emit warnings users learn to ignore, or silently change severity."]

[judgment.security]
advocate = ["Parity locks, constant-time comparisons, bounded shared state, fuzzed safe URLs, and deployment checks."]
do_not = ["Broaden policy assumptions, hide permissive fallbacks, or publish authorization examples based on user-controlled facts."]

[judgment.pelt]
advocate = ["Sans-I/O fuzzing, free-threaded stress tests, actionable PELT_* errors, and honest benchmark caveats."]
do_not = ["Add compiled extensions, hold locks across I/O, or change the Database seam without coordinated proof."]

[judgment.examples]
advocate = ["Offline copy-paste paths that teach return types and feed safer patterns back into scaffolds."]
do_not = ["Take good-first issues, hide optional dependencies, or commit secrets and private endpoints."]

[judgment.benchmarks]
advocate = ["Versioned artifacts with environment capture, failure preservation, and explicit synthetic-workload caveats."]
do_not = ["Overclaim production performance or compare mismatched workloads and client limits."]

[judgment.plan]
advocate = ["Ranked executable leaf work with explicit proof, dependencies, dissent, blockers, and not-now scope."]
do_not = ["Duplicate issue scope in roadmap files, mark parents ready, or present speculative plans as shipped behavior."]
