[[steward]]
id = "root"
path = "AGENTS.md"
point_of_view = "Protect Chirp's hypermedia-native architecture and route work to the narrowest knowledgeable steward."
edges = [
  { to = "public", type = "governs", what = "public imports and configuration" },
  { to = "templating", type = "governs", what = "single-template rendering contract" },
  { to = "contracts", type = "verified-by", what = "startup contract checks" },
  { to = "tests", type = "verified-by", what = "regression proof" },
]

[[steward]]
id = "public"
path = "src/chirp/AGENTS.md"
point_of_view = "Keep the import path app authors memorize small, intentional, lazy, and documented."
guardrails = [
  "New top-level names move together across __all__, _LAZY_IMPORTS, _API_STATUS, public docs, tests, and changelog.",
  "AppConfig remains frozen and slotted; new fields are public API and require environment-parity review.",
]
owns.code = ["src/chirp/*.py"]
owns.tests = ["tests/test_lazy_imports.py", "tests/test_config.py", "tests/test_public_api_docs.py"]
owns.docs = ["README.md", "docs/public-api.md", "docs/release-policy.md"]
edges = [{ to = "docs", type = "explained-by", what = "public API and release policy" }]

[[steward]]
id = "internal"
path = "src/chirp/_internal/AGENTS.md"
point_of_view = "Keep shared ASGI shapes, invocation plans, context propagation, kwargs resolution, and multimap protocols private and behaviorally stable."
guardrails = ["Internal helpers do not become convenience public exports.", "Invocation compilation preserves sync, async, dependency, and request-context semantics."]
owns.code = ["src/chirp/_internal/"]
owns.tests = ["tests/test_asgi.py", "tests/test_invoke_plan.py", "tests/test_headers.py"]
owns.docs = []
edges = [{ to = "public", type = "hidden-behind", what = "public call paths" }, { to = "server", type = "serves", what = "handler invocation" }]

[[steward]]
id = "settings"
path = "src/chirp/settings/AGENTS.md"
point_of_view = "Keep runtime-mutable operator settings explicit, typed, observable, and separate from frozen public AppConfig."
guardrails = ["Settings mutation uses the registry/store lifecycle rather than weakening AppConfig immutability.", "File and database stores preserve revision and conflict behavior."]
owns.code = ["src/chirp/settings/"]
owns.tests = ["tests/test_settings_registry.py"]
owns.docs = ["docs/"]
edges = [{ to = "public", type = "separate-from", what = "frozen AppConfig" }, { to = "app", type = "observed-by", what = "runtime lifecycle" }]

[[steward]]
id = "app"
path = "src/chirp/app/AGENTS.md"
point_of_view = "Guard the boundary where setup-time mutation becomes immutable runtime truth."
guardrails = [
  "Freeze publishes a complete runtime state under the free-threaded lifecycle boundary.",
  "Registration after freeze and serving a consumed mounted app fail loud.",
]
owns.code = ["src/chirp/app/"]
owns.tests = ["tests/test_app/", "tests/test_mount_app.py", "tests/test_url_for.py"]
