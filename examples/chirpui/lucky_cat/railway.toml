# Lucky Cat — Railway service config.
#
# Deploy with the example directory as the service root directory:
#     railway up   (from examples/chirpui/lucky_cat/)
#
# See docs/deployment/railway.md for the recommended production shape.
# Required service variables: CHIRP_ENV=production, CHIRP_DEBUG=0,
# CHIRP_SECRET_KEY=<generated secret>, CHIRP_LOG_FORMAT=json,
# CHIRP_REF=main (build arg — the git ref the Dockerfile installs Chirp from, so
# framework tracks the demo's bleeding edge; set a branch/tag/SHA here to pin).
# Keep this a SINGLE web replica — the demo holds all state in process memory
# (wallet / trade store / SimFeed / signal bus); see README "Configuration".

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# app.py runs `app.run()`; AppConfig.from_env() binds 0.0.0.0:$PORT on Railway.
startCommand = "python app.py"
healthcheckPath = "/health"
# Generous window for a cold start (SimFeed warm + signal bus + chart geometry).
# Mirrors the elbysodic shell deploy this example's rail was ported from.
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
numReplicas = 1
