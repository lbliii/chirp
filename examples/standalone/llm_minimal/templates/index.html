<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Minimal — streaming tokens</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a; color: #e2e8f0;
      min-height: 100vh; max-width: 640px; margin: 0 auto; padding: 1.5rem;
    }
    h1 { font-size: 1.25rem; margin-bottom: 0.25rem; color: #f8fafc; }
    .hint { font-size: 0.8rem; color: #64748b; margin-bottom: 1.25rem; }
    h2 { font-size: 0.95rem; margin: 1.5rem 0 0.5rem; color: #cbd5e1; }
    form { display: flex; gap: 0.5rem; }
    input {
      flex: 1; padding: 0.5rem 0.75rem;
      background: #1e293b; border: 1px solid #334155;
      border-radius: 0.375rem; color: #e2e8f0;
    }
    button {
      padding: 0.5rem 1rem; background: #22c55e; color: #0f172a;
      border: none; border-radius: 0.375rem; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #16a34a; }
    .response {
      background: #1e293b; padding: 1rem; border-radius: 0.5rem;
      min-height: 4rem; margin-top: 0.5rem; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>LLM Minimal</h1>
  <p class="hint">Streaming tokens — simulated by default, no Ollama required.</p>

  <h2>TemplateStream (chunked HTML body)</h2>
  <form action="/ask" method="post" hx-post="/ask" hx-target="#answer" hx-swap="innerHTML">
    <input name="prompt" placeholder="Ask something..." value="What is Chirp?">
    <button type="submit">Stream</button>
  </form>
  <div id="answer" class="response"></div>

  <h2>EventStream (SSE, one Fragment per token)</h2>
  <div hx-ext="sse" sse-connect="/stream" sse-close="close" style="display: contents">
    <div class="response" sse-swap="message" hx-swap="beforeend"></div>
  </div>
</body>
</html>
