# Pre-commit hooks for Chirp
# Install: uv run prek install  (or: poe hooks-install)
# Run manually: uv run prek run --all-files  (or: poe hooks)
#
# Chirp requires Python 3.14+ (free-threading, modern syntax)

default_language_version:
  python: python3.14

# Install both the commit-time hooks (default) and the pre-push preflight.
# Run `poe hooks-install` (prek install) to wire these up.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      # Run the linter
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run poe format
        language: system
        types: [python]
        pass_filenames: false
      - id: ty
        name: ty type checker
        entry: uv run ty check src/chirp/
        language: system
        types: [python]
        pass_filenames: false
      - id: changelog-fragment-format
        name: changelog fragment format (no leading dash)
        entry: python scripts/check_changelog_fragments.py
        language: system
        files: ^changelog\.d/\+.*\.(added|changed|deprecated|removed|fixed|security)\.md$
        pass_filenames: true
      - id: roadmap-staleness
        name: roadmap staleness (no static 'no open issues' claim)
        entry: python scripts/check_roadmap_staleness.py
        language: system
        files: ^(ROADMAP\.md|plan/roadmap\.md)$
        pass_filenames: false
      - id: preflight
        name: preflight (fast whole-repo invariants)
        entry: uv run poe preflight
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-toml
      - id: check-yaml
        args: [--unsafe]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-executables-have-shebangs
      - id: detect-private-key
