# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14t"

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/bengal-chirp

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  furatena-canary:
    name: Furatena compatibility canary (advisory)
    runs-on: ubuntu-latest
    needs:
      - release-build
    continue-on-error: true
    timeout-minutes: 20
    env:
      FURATENA_REVISION: da584bf9fe19ec1376fdc0b23c7fb1b657b026b8

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14t"

      - name: Check out pinned Furatena revision
        id: checkout
        env:
          GH_TOKEN: ${{ secrets.FURATENA_CANARY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::FURATENA_CANARY_TOKEN is not configured"
            exit 1
          fi
          gh repo clone lbliii/furatena furatena -- --no-checkout
          git -C furatena checkout --detach "$FURATENA_REVISION"
          actual_revision="$(git -C furatena rev-parse HEAD)"
          if [ "$actual_revision" != "$FURATENA_REVISION" ]; then
            echo "::error::Furatena revision mismatch: expected $FURATENA_REVISION, got $actual_revision"
            exit 1
          fi

      - name: Install Furatena locked dependencies
        id: dependencies
        working-directory: furatena
        run: uv sync --locked --all-groups

      - name: Force-install and verify the Chirp candidate wheel
        id: candidate
        run: |
          wheel="$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print -quit)"
          if [ -z "$wheel" ]; then
            echo "::error::No Chirp wheel found under $GITHUB_WORKSPACE/dist"
            exit 1
          fi
          uv pip install \
            --python "$GITHUB_WORKSPACE/furatena/.venv/bin/python" \
            --force-reinstall \
            --no-deps \
            "$wheel"
          furatena/.venv/bin/python -c '
          from importlib.metadata import version
          from pathlib import Path
          import sys
          import chirp
          import_path = Path(chirp.__file__).resolve()
          environment = Path(sys.prefix).resolve()
          assert import_path.is_relative_to(environment), (import_path, environment)
          assert "site-packages" in import_path.parts, import_path
          candidate_version = version("bengal-chirp")
          print(f"bengal-chirp {candidate_version}")
          print(f"candidate import: {import_path}")
          '

      - name: Run focused Furatena compatibility tests
        id: compatibility
        working-directory: furatena
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_fura_cli_standalone.py::test_init_app_passes_strict_content_check \
            tests/test_fura_cli_standalone.py::test_author_page_chrome_routes_and_status_model \
            tests/test_shell_boost_links.py::TestShellBoostHrefs::test_boost_filter_skips_assets \
            tests/test_chirp_docs_search.py::TestHybridSearchCore::test_hybrid_search_returns_hits \
            tests/test_chirp_docs_search.py::TestHybridSearchCore::test_build_search_page_cards_groups_by_node \
            tests/test_chirp_docs_view_lint.py::TestAuthorStaleRoute::test_author_sse_event_reports_invalidation_payload \
            tests/test_chirp_docs_view_lint.py::TestAuthorStaleRoute::test_author_page_actions_contract_is_stable_for_mobile_and_htmx \
            tests/test_chirp_docs_view_lint.py::TestAuthorStaleRoute::test_author_reload_after_source_edit_updates_dom_and_clears_hints \
            tests/test_chirp_docs_maturity.py::TestMaturityPreviewParity::test_preview_theme_mounts_frozen_vendor \
            tests/test_chirp_docs_static_export.py::TestMiniStaticExport::test_export_writes_html_and_sidecars \
            tests/test_fura_cli_standalone.py::test_init_app_freezes_and_exports_static_site

      - name: Summarize canary ownership
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          COMPATIBILITY_OUTCOME: ${{ steps.compatibility.outcome }}
        run: |
          {
            echo "## Furatena compatibility canary"
            echo
            echo "- Pinned revision: \`$FURATENA_REVISION\`"
            echo "- Harness checkout and pin: $CHECKOUT_OUTCOME"
            echo "- Furatena locked dependencies: $DEPENDENCIES_OUTCOME"
            echo "- Chirp candidate wheel and provenance: $CANDIDATE_OUTCOME"
            echo "- Downstream compatibility slice: $COMPATIBILITY_OUTCOME"
            echo
            echo "This job is advisory and does not block PyPI publication."
            echo "See docs/release-policy.md for failure ownership and escalation."
          } >> "$GITHUB_STEP_SUMMARY"
