name: Backlog reconciliation

# Weekly (and on-demand) sweep that re-derives backlog truth from merged PRs +
# acceptance-test coverage and reports graph/workability drift, so the tracker
# cannot silently rot behind a fast, agent-driven merge cadence. Scheduled runs
# are read-only while the graph-aware rules soak; manual runs may apply only
# deterministic derived labels.
# See docs/backlog-automation.md.

on:
  schedule:
    - cron: "17 13 * * 1" # Mondays 13:17 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply derived labels (uncheck for a dry-run report only)"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Reconcile backlog
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        run: |
          ARGS="--report-workability --with-dependencies --snapshot backlog-snapshot.json"
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          uv run --no-project python scripts/reconcile_backlog.py $ARGS | tee backlog-report.md | tee -a "$GITHUB_STEP_SUMMARY"
          uv run --no-project python scripts/reconcile_backlog.py --json --with-dependencies > backlog-findings.json

      - name: Upload backlog receipts
        uses: actions/upload-artifact@v7
        with:
          name: backlog-reconciliation-${{ github.run_id }}
          path: |
            backlog-report.md
            backlog-findings.json
            backlog-snapshot.json
