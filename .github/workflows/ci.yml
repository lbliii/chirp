name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14t"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --no-sources --group dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format . --check

      - name: Exception hygiene ratchet
        run: uv run python scripts/lint_exception_hygiene.py

  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14t"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --no-sources --group dev

      - name: Ty type checker
        run: uv run ty check src/chirp/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14t"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --no-sources --group dev

      - name: Tests
        env:
          PYTHON_GIL: "0"
        run: uv run pytest -q --tb=short --timeout=60 -m "not slow" --ignore=examples/chirpui/lucky_cat/test_browser_smoke.py -n 4 --dist loadgroup --cov --cov-report=term

  # Real-browser smoke for the Lucky Cat shell (issue #286). Playwright needs
  # Chromium system deps that we install via `playwright install --with-deps`;
  # isolated here so the main free-threaded test job stays lean.
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-browser-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-browser-
            uv-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install dependencies (with Playwright)
        run: uv sync --no-sources --group dev --group browser

      - name: Install Chromium
        run: uv run playwright install chromium --with-deps

      # Pin after the last syncing uv command so the browser smoke cannot
      # silently restore a newer chirp-ui release from project resolution.
      # The separate compatibility matrix still exercises the latest release.
      - name: Pin Lucky Cat browser compatibility floor
        run: uv pip install "chirp-ui==0.10.0"

      - name: Browser smoke
        run: >-
          uv run --no-sync pytest
          examples/chirpui/lucky_cat/test_browser_smoke.py
          examples/standalone/htmx_managed/test_browser_smoke.py
          examples/standalone/devtools_htmx4/test_browser_smoke.py
          examples/standalone/webmcp_form/test_browser_smoke.py
          tests/contracts/test_query_devtools_browser.py
          tests/contracts/test_query_cors_browser.py
          -q --tb=short --timeout=120 -m "not slow"

  # Real-wire RFC 10008 interoperability proof (issue #532). The main job
  # covers core H1 behavior; this lane installs optional protocol clients and
  # a representative reverse proxy so H2/H3/proxy paths cannot silently skip.
  query-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-query-interop-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-query-interop-
            uv-${{ runner.os }}-

      - name: Install project and protocol clients
        run: |
          uv sync --no-sources --group dev
          uv pip install "bengal-pounce[h2,h3]==0.8.2" "httpx[http2]>=0.27.0" "uvicorn==0.32.0"

      - name: Install Nginx interoperability proxy
        run: |
          sudo apt-get update
          sudo apt-get install --yes nginx

      - name: Record interoperability environment
        run: |
          uv run --no-sync python -c "import importlib.metadata as m, platform; print(platform.platform()); print(platform.python_version()); print('pounce', m.version('bengal-pounce')); print('httpx', m.version('httpx')); print('uvicorn', m.version('uvicorn')); print('zoomies', m.version('bengal-zoomies'))"
          nginx -v

      - name: QUERY wire, retry, redirect, limit, log, and proxy proof
        run: >-
          uv run --no-sync pytest
          tests/interop/test_query_wire.py
          -q --tb=short --timeout=120

  # Dedicated live-PostgreSQL backend matrix. PostgreSQL 13 is pinned to its
  # final EOL image as a compatibility lane; supported majors track their
  # current official image. The free-threaded gate below supplies the separate
  # no-GIL concurrency proof (issues #143, #258, #259, and #260).
  test-postgres:
    name: PostgreSQL ${{ matrix.pg_major }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg_major: "13"
            image: postgres:13.22-bookworm
          - pg_major: "14"
            image: postgres:14
          - pg_major: "15"
            image: postgres:15
          - pg_major: "16"
            image: postgres:16
          - pg_major: "17"
            image: postgres:17
          - pg_major: "18"
            image: postgres:18
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: chirp
          POSTGRES_PASSWORD: chirp
          POSTGRES_DB: chirp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-pg-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-pg-
            uv-${{ runner.os }}-

      - name: Install dependencies (with PostgreSQL driver)
        run: uv sync --no-sources --group dev --extra data-pg

      - name: PostgreSQL round-trip tests
        env:
          CHIRP_TEST_PG_DSN: postgresql://chirp:chirp@localhost:5432/chirp_test
        run: uv run pytest tests/test_schema_introspect.py tests/test_pelt/test_connection_integration.py -q --tb=short --timeout=60

      - name: Pelt benchmark smoke
        env:
          CHIRP_BENCH_PG_DSN: postgresql://chirp:chirp@localhost:5432/chirp_test
        run: >-
          uv run python -m benchmarks.pelt
          --concurrency 1,2
          --queries 4
          --warmup 1
          --stream-rows 10
          --stream-batch-size 5
          --bulk-rows 4
          --output /tmp/pelt-smoke.json

  # Free-threaded GIL gate for the in-tree data-pg backend (pelt E0.2/E6,
  # issues #262 and #259). PYTHONWARNINGS=error turns an import that silently
  # re-enables the GIL into a build failure; stress tests prove shared-state
  # snapshots, decode overlap, and exclusive pool ownership.
  data-pg-gil-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14t"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-data-pg-gil-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-data-pg-gil-
            uv-${{ runner.os }}-

      - name: Install dependencies (data-pg extra)
        run: uv sync --no-sources --group dev --extra data-pg

      - name: GIL gate — pelt / Postgres backend import
        env:
          PYTHON_GIL: "0"
          PYTHONWARNINGS: error
        run: uv run pytest tests/test_pelt/test_data_pg_gil.py tests/test_pelt/test_concurrency_stress.py -q --tb=short --timeout=60

  # Cross-version compatibility between Chirp and chirp-ui (issue #157).
  # Catches same-author upstream breaks before they ship as a release regression.
  chirp-ui-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - chirp-ui-version: "0.10.0"
          - chirp-ui-version: latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14t"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-chirpui-${{ matrix.chirp-ui-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-chirpui-
            uv-${{ runner.os }}-

      - name: Install dependencies (ChirpUI extra)
        run: uv sync --no-sources --group dev --extra ui

      - name: Pin chirp-ui version
        run: |
          if [ "${{ matrix.chirp-ui-version }}" = "latest" ]; then
            uv pip install --upgrade chirp-ui
          else
            uv pip install "chirp-ui==${{ matrix.chirp-ui-version }}"
          fi

      - name: Cross-version boundary and contract tests
        env:
          PYTHON_GIL: "0"
        run: |
          uv run pytest tests/test_chirpui_boundary.py tests/contracts/test_custom_checks_integration.py tests/test_chirpui_compat_ci.py -q --tb=short --timeout=60

      - name: Cross-version shell example smoke
        env:
          PYTHON_GIL: "0"
        run: |
          uv run pytest examples/chirpui/contacts_shell examples/chirpui/forum_shell examples/chirpui/pages_shell -q --tb=short --timeout=60 -m "not slow"
