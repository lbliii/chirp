name: Benchmarks

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/benchmarks.yml"
      - "benchmarks/**"
      - "src/chirp/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  pelt-controlled-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHON_GIL: "0"
      CHIRP_BENCH_PG_DSN: postgresql://chirp:chirp@localhost:5432/chirp_bench
      CHIRP_BENCH_PG_IMAGE: postgres:18.1-bookworm
    services:
      postgres:
        image: postgres:18.1-bookworm
        env:
          POSTGRES_USER: chirp
          POSTGRES_PASSWORD: chirp
          POSTGRES_DB: chirp_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv with fixed free-threaded Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.2t"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --no-sources --group dev --extra data-pg

      - name: Run controlled Pelt evidence
        run: >-
          uv run --no-sync python -m benchmarks.pelt_controlled
          --repetitions 5
          --concurrency 1,2,4,8
          --queries 1000
          --warmup 10
          --stream-rows 10000
          --stream-batch-size 100
          --bulk-rows 500
          --output benchmark-artifacts/pelt-controlled.json

      - name: Upload controlled Pelt evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pelt-controlled-${{ github.sha }}
          path: benchmark-artifacts/pelt-controlled.json
          if-no-files-found: error

  core-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_GIL: "0"
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          path: candidate

      - name: Check out base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14t"
          enable-cache: true
          cache-dependency-glob: |
            baseline/uv.lock
            candidate/uv.lock

      - name: Install base dependencies
        if: github.event_name == 'pull_request'
        working-directory: baseline
        run: uv sync --no-sources --group dev

      - name: Install candidate dependencies
        working-directory: candidate
        run: uv sync --no-sources --group dev

      - name: Run paired base and candidate benchmarks
        if: github.event_name == 'pull_request'
        run: |
          for round in 1 2 3; do
            uv run --directory baseline --no-sync python -m benchmarks.core \
              --iterations 250 \
              --route-count 100 \
              --output "../benchmark-artifacts/base-${round}.json"
            uv run --directory candidate --no-sync python -m benchmarks.core \
              --iterations 250 \
              --route-count 100 \
              --output "../benchmark-artifacts/candidate-${round}.json"
          done

      - name: Run candidate benchmarks
        if: github.event_name == 'workflow_dispatch'
        working-directory: candidate
        run: >-
          uv run --no-sync python -m benchmarks.core
          --iterations 250
          --route-count 100
          --output ../benchmark-artifacts/candidate.json

      - name: Compare base and candidate
        id: comparison
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: candidate
        run: >-
          uv run --no-sync python -m benchmarks.compare
          --baseline ../benchmark-artifacts/base-1.json
          --baseline ../benchmark-artifacts/base-2.json
          --baseline ../benchmark-artifacts/base-3.json
          --candidate ../benchmark-artifacts/candidate-1.json
          --candidate ../benchmark-artifacts/candidate-2.json
          --candidate ../benchmark-artifacts/candidate-3.json
          --markdown-output ../benchmark-artifacts/comparison.md

      - name: Add comparison to job summary
        if: github.event_name == 'pull_request' && always()
        run: cat benchmark-artifacts/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update benchmark PR comment
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- chirp-core-benchmark-comparison -->";
            const body = fs.readFileSync("benchmark-artifacts/comparison.md", "utf8");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find(comment => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-benchmarks-${{ github.sha }}
          path: benchmark-artifacts/

      - name: Enforce regression budget
        if: github.event_name == 'pull_request' && steps.comparison.outcome == 'failure'
        run: exit 1
