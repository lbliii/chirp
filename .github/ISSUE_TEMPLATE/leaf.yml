name: Task
description: Actionable leaf work — scope, dependencies, proof, acceptance criteria
title: "Task: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **Tracking:** This issue body is the task spec. Repo planning files only link here.

        **Closure:** `Closes #N` requires `@pytest.mark.issue(N)` proof or an
        issue-qualified exemption such as
        `Acceptance #N: n/a (docs-only; no runtime behavior)`.

        Set title to `Task: …` and add a `priority:P*` label (or legacy `P*`) matching the dropdown below.

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true

  - type: dropdown
    id: execution_state
    attributes:
      label: Execution state
      description: Select Ready only when dependencies and required approvals are satisfied; apply the matching workflow label after creation.
      options:
        - Ready now
        - Blocked by an internal issue
        - Blocked by an upstream or external event
    validations:
      required: true

  - type: input
    id: parent
    attributes:
      label: Parent epic
      description: Descriptive reference; attach this task as an actual GitHub sub-issue after creation.
      placeholder: "#337"
    validations:
      required: true

  - type: textarea
    id: depends_on
    attributes:
      label: Depends on
      description: Blocking issues only. This task cannot be `ready` until they close. Write `None` when unblocked.
      placeholder: |
        - #652 topology projection
        - #647 intent capture
    validations:
      required: false

  - type: textarea
    id: revisit_trigger
    attributes:
      label: Blocker / revisit trigger
      description: For blocked work, name the blocker, the exact condition that clears it, and the first action after unblock. Write `None` when ready.
    validations:
      required: true

  - type: input
    id: rfc
    attributes:
      label: RFC or design doc (if any)
      description: In-repo path — do not duplicate RFC scope here.
      placeholder: "docs/rfcs/021-contract-explorer.md"
    validations:
      required: false

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: One sentence — what is true when this issue closes?
    validations:
      required: true

  - type: textarea
    id: next_action
    attributes:
      label: Immediate next action
      description: The first concrete action an agent can take without another design decision.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Concrete changes included in this issue.
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries / not in this issue
      description: Explicit exclusions to keep the PR focused.
    validations:
      required: true

  - type: textarea
    id: proof
    attributes:
      label: Required proof
      description: Commands and tests that must pass. Name `@pytest.mark.issue(N)` test(s) you will add.
      placeholder: |
        - `uv run pytest tests/contracts/test_explorer_projection.py -q`
        - `@pytest.mark.issue(N)` covers exact attachment and unbound findings
        - `uv run ruff check .` and `uv run ty check src/chirp/`
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist a reviewer can verify. Prefer testable statements.
      placeholder: |
        - [ ] Exact route/template identity binding works for mounted apps
        - [ ] Unbound findings stay explicit; no prose matching
        - [ ] Finding codes and severities unchanged
    validations:
      required: true

  - type: textarea
    id: collateral
    attributes:
      label: Collateral
      description: Docs, examples, changelog, public API review — if any.
    validations:
      required: false

  - type: textarea
    id: approval
    attributes:
      label: Dependencies / approval
      description: Required approval or decision plus its owner and revisit trigger. This task cannot be `ready` while unresolved.
    validations:
      required: false
