name: RFC / research
description: Design exploration — not shipped behavior until promoted to implementation children
title: "RFC: "
labels:
  - rfc
  - research
body:
  - type: markdown
    attributes:
      value: |
        **Status:** This is a research/decision leaf. Apply `ready` only when
        the research itself is immediately actionable.

        **Tracking:** Accepted RFC prose lives in `docs/rfcs/`. The parent field
        is descriptive only; attach this issue through GitHub's actual
        sub-issue relationship.

        **Closure:** Record an approved/rejected/deferred/superseded decision.
        If approved, create a separate implementation epic and bounded task
        children, attach them to the proper saga, then close this RFC.

        Horizon parent: [#335](https://github.com/lbliii/chirp/issues/335) · [`docs/backlog-automation.md`](https://github.com/lbliii/chirp/blob/main/docs/backlog-automation.md)

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P2
        - P3
    validations:
      required: true

  - type: dropdown
    id: execution_state
    attributes:
      label: Research state
      description: Research may be ready even though implementation is not approved.
      options:
        - Ready to research now
        - Blocked by an internal issue
        - Blocked by an upstream or external event
    validations:
      required: true

  - type: input
    id: parent
    attributes:
      label: Parent saga
      placeholder: "#335"
    validations:
      required: false

  - type: textarea
    id: what
    attributes:
      label: What
      description: What capability or contract are we exploring?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why only Chirp / why now
      description: Hypermedia-native advantage or downstream pressure.
    validations:
      required: true

  - type: textarea
    id: depends_on
    attributes:
      label: Depends on
      description: Blocking issues/upstreams plus the exact condition for revisiting this RFC.
    validations:
      required: false

  - type: textarea
    id: research_questions
    attributes:
      label: Research questions
      description: Open decisions to settle before implementation children open.
      placeholder: |
        - [ ] What is the public API shape?
        - [ ] Which categories become deploy-blocking vs warn-only?
        - [ ] What proof matrix closes the RFC?
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
    validations:
      required: true

  - type: textarea
    id: success_criteria
    attributes:
      label: Success criteria
      description: Decision gate — evidence and disposition recorded; implementation moves to separate issues.
      placeholder: |
        - RFC merged to `docs/rfcs/`
        - Steward sign-off and decision receipt recorded
        - Approved: implementation epic/tasks created and attached
        - Rejected/deferred: rationale and revisit trigger recorded
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: Related issues and stewards
      placeholder: |
        - #337 Contract Explorer
        - `src/chirp/contracts/AGENTS.md`
    validations:
      required: false
