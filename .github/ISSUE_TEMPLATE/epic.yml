name: Epic
description: Major initiative — create GitHub sub-issues for tasks, not body checklists
title: "Epic: "
labels:
  - epic
body:
  - type: markdown
    attributes:
      value: |
        **Tracking:** Create bounded tasks immediately and attach them through
        GitHub's actual sub-issue relationship. The parent field below is
        descriptive only; body links and `- [ ] #N` lists do not count.

        **Workability:** Never label an epic `ready`. An unblocked epic exposes
        at least one ready leaf. A blocked epic names its blocker and revisit
        trigger.

        **Closure:** Epics close when actual sub-issues and epic-level exit
        gates close. PRs use `Advances-Epic: #N`; reserve `Closes #N` for leaf
        deliverables.

        Read [`docs/backlog-automation.md`](https://github.com/lbliii/chirp/blob/main/docs/backlog-automation.md).

  - type: input
    id: parent
    attributes:
      label: Parent saga
      description: Descriptive reference only; attach this epic as an actual GitHub sub-issue after creation.
      placeholder: "#584"
    validations:
      required: false

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true when this epic is done?
      placeholder: |
        Boosted shell navigation never blanks the inner outlet; `chirp check` catches shell/fragment target mismatches statically.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Problem / context
      description: User-visible risk, downstream pressure, or why now.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and related work
      description: Blocking issues/RFCs/upstreams and exact revisit triggers. Write `None` when unblocked.
      placeholder: |
        - #652 topology projection
        - `docs/rfcs/021-contract-explorer.md`
        - Elbysodic consume after release
    validations:
      required: false

  - type: textarea
    id: exit_criteria
    attributes:
      label: Exit criteria
      description: Parent-level cross-child gates only; do not mirror child issue status here.
      placeholder: |
        - [ ] Elbysodic repro navigates cleanly with boost enabled
        - [ ] `chirp check` catches the mismatch class
        - [ ] App-side workaround removed
    validations:
      required: true

  - type: textarea
    id: not_in_scope
    attributes:
      label: Not in scope
      description: What child issues or future work must explicitly avoid.
    validations:
      required: false
