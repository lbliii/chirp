<style>
/* chirp.docs — minimal base styles */
.chirp-docs-layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 2rem;
  max-width: 1200px;
  margin: 0 auto;
  padding: 1.5rem;
  font-family: system-ui, -apple-system, sans-serif;
  line-height: 1.6;
  color: #1a1a2e;
}

/* Sidebar */
.chirp-docs-sidebar {
  position: sticky;
  top: 1.5rem;
  max-height: calc(100vh - 3rem);
  overflow-y: auto;
  padding-right: 1rem;
  border-right: 1px solid #e2e8f0;
  font-size: 0.9rem;
}
.chirp-docs-sidebar details {
  margin-bottom: 0.75rem;
}
.chirp-docs-sidebar summary {
  font-weight: 600;
  cursor: pointer;
  padding: 0.25rem 0;
  color: #334155;
  list-style: none;
}
.chirp-docs-sidebar summary::before {
  content: "\25B8";
  display: inline-block;
  margin-right: 0.4rem;
  transition: transform 0.15s;
}
.chirp-docs-sidebar details[open] > summary::before {
  transform: rotate(90deg);
}
.chirp-docs-sidebar summary a {
  color: inherit;
  text-decoration: none;
}
.chirp-docs-sidebar summary a:hover {
  color: #2563eb;
}
.chirp-docs-sidebar ul {
  list-style: none;
  padding: 0 0 0 1.2rem;
  margin: 0.25rem 0 0;
}
.chirp-docs-sidebar li {
  margin: 0.15rem 0;
}
.chirp-docs-sidebar a {
  color: #475569;
  text-decoration: none;
  display: block;
  padding: 0.2rem 0.5rem;
  border-radius: 4px;
  transition: background 0.1s, color 0.1s;
}
.chirp-docs-sidebar a:hover {
  background: #f1f5f9;
  color: #1e40af;
}
.chirp-docs-sidebar .active a {
  background: #eff6ff;
  color: #1d4ed8;
  font-weight: 500;
}

/* Search */
.chirp-docs-search {
  margin-bottom: 1rem;
}
.chirp-docs-search input {
  width: 100%;
  padding: 0.5rem 0.75rem;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.15s;
  box-sizing: border-box;
}
.chirp-docs-search input:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

/* Main content */
.chirp-docs-content {
  min-width: 0;
  max-width: 48rem;
}
.chirp-docs-content h1 {
  font-size: 2rem;
  font-weight: 700;
  margin: 0 0 1rem;
  color: #0f172a;
  line-height: 1.2;
}
.chirp-docs-content h2 {
  font-size: 1.5rem;
  font-weight: 600;
  margin: 2rem 0 0.75rem;
  padding-bottom: 0.3rem;
  border-bottom: 1px solid #e2e8f0;
  color: #1e293b;
}
.chirp-docs-content h3 {
  font-size: 1.15rem;
  font-weight: 600;
  margin: 1.5rem 0 0.5rem;
  color: #334155;
}
.chirp-docs-content p {
  margin: 0.75rem 0;
}
.chirp-docs-content a {
  color: #2563eb;
  text-decoration: none;
}
.chirp-docs-content a:hover {
  text-decoration: underline;
}
.chirp-docs-content code {
  background: #f1f5f9;
  padding: 0.15rem 0.35rem;
  border-radius: 3px;
  font-size: 0.875em;
  font-family: "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
}
.chirp-docs-content pre {
  background: #1e293b;
  color: #e2e8f0;
  padding: 1rem 1.25rem;
  border-radius: 8px;
  overflow-x: auto;
  font-size: 0.85rem;
  line-height: 1.5;
  margin: 1rem 0;
}
.chirp-docs-content pre code {
  background: none;
  padding: 0;
  color: inherit;
  font-size: inherit;
}
.chirp-docs-content table {
  width: 100%;
  border-collapse: collapse;
  margin: 1rem 0;
  font-size: 0.9rem;
}
.chirp-docs-content th,
.chirp-docs-content td {
  text-align: left;
  padding: 0.5rem 0.75rem;
  border-bottom: 1px solid #e2e8f0;
}
.chirp-docs-content th {
  font-weight: 600;
  background: #f8fafc;
}
.chirp-docs-content ul,
.chirp-docs-content ol {
  padding-left: 1.5rem;
  margin: 0.5rem 0;
}
.chirp-docs-content li {
  margin: 0.3rem 0;
}
.chirp-docs-content blockquote {
  border-left: 3px solid #3b82f6;
  margin: 1rem 0;
  padding: 0.5rem 1rem;
  background: #f8fafc;
  color: #475569;
}

/* TOC */
.chirp-docs-toc {
  font-size: 0.85rem;
}
.chirp-docs-toc h3 {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #64748b;
  margin: 0 0 0.5rem;
}
.chirp-docs-toc ul {
  list-style: none;
  padding: 0;
  margin: 0;
}
.chirp-docs-toc li {
  margin: 0.2rem 0;
}
.chirp-docs-toc a {
  color: #64748b;
  text-decoration: none;
}
.chirp-docs-toc a:hover {
  color: #2563eb;
}
.toc-level-2 { padding-left: 0; }
.toc-level-3 { padding-left: 0.75rem; }
.toc-level-4 { padding-left: 1.5rem; }

/* Docs list/index */
.chirp-docs-list {
  max-width: 48rem;
}
.chirp-docs-list h1 {
  font-size: 2rem;
  font-weight: 700;
  margin: 0 0 1.5rem;
  color: #0f172a;
}
.chirp-docs-list h2 {
  font-size: 1.25rem;
  font-weight: 600;
  margin: 1.5rem 0 0.5rem;
  color: #1e293b;
}
.chirp-docs-list h2 a {
  color: inherit;
  text-decoration: none;
}
.chirp-docs-list h2 a:hover {
  color: #2563eb;
}
.chirp-docs-list ul {
  list-style: none;
  padding: 0;
}
.chirp-docs-list li {
  margin: 0.25rem 0;
}
.chirp-docs-list li a {
  display: block;
  padding: 0.6rem 0.75rem;
  border-radius: 6px;
  text-decoration: none;
  color: #1e293b;
  transition: background 0.1s;
}
.chirp-docs-list li a:hover {
  background: #f1f5f9;
}
.chirp-docs-list li a strong {
  display: block;
  font-weight: 500;
}
.chirp-docs-list li a span {
  display: block;
  font-size: 0.85rem;
  color: #64748b;
  margin-top: 0.1rem;
}

/* Search results */
.chirp-docs-search-results h2 {
  color: #475569;
  font-weight: 500;
}
.chirp-docs-no-results {
  color: #94a3b8;
  font-style: italic;
  padding: 2rem 0;
}

/* Skeleton/loading */
.chirp-docs-skeleton {
  color: #94a3b8;
  padding: 2rem;
  text-align: center;
  animation: chirp-docs-pulse 1.5s ease-in-out infinite;
}
@keyframes chirp-docs-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* Responsive */
@media (max-width: 768px) {
  .chirp-docs-layout {
    grid-template-columns: 1fr;
    padding: 1rem;
  }
  .chirp-docs-sidebar {
    position: static;
    max-height: none;
    border-right: none;
    border-bottom: 1px solid #e2e8f0;
    padding-right: 0;
    padding-bottom: 1rem;
    margin-bottom: 1rem;
  }
}
</style>
